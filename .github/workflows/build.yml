name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Gradle Globally
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip
        wget https://services.gradle.org/distributions/gradle-8.10-bin.zip
        sudo mkdir /opt/gradle
        sudo unzip -d /opt/gradle gradle-8.10-bin.zip
        export PATH=$PATH:/opt/gradle/gradle-8.10/bin
        echo "/opt/gradle/gradle-8.10/bin" >> $GITHUB_PATH

    - name: Build Mod with Global Gradle
      run: gradle build --no-daemon
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: AuraVisual-1.21.4
        path: build/libs/*.jar
